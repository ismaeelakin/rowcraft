<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">Rowcraft browser architecture</title><desc id="desc">A file enters a browser worker; rules and results move between the worker and review interface. Ready CSV and excluded-record JSON are separate exports.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#762b3b"/></marker></defs>
<rect width="1100" height="480" fill="#f3f0ea"/><g font-family="Trebuchet MS, Lucida Sans Unicode, sans-serif" fill="#24282b" color="#24282b"><rect x="0" y="0" width="1100" height="72" fill="#762b3b" stroke="none" stroke-dasharray=""/><text x="30" y="46" font-size="27" fill="#fff7ed" font-weight="bold" text-anchor="start">ROWCRAFT / FILE REVIEW</text><rect x="310" y="107" width="450" height="300" fill="#ece7df" stroke="#a8897e" stroke-dasharray="7 5"/><text x="330" y="135" font-size="13" fill="#762b3b" font-weight="bold" text-anchor="start">ONE BROWSER TAB</text><rect x="35" y="175" width="220" height="110" fill="#fff" stroke="#b9a89e" stroke-dasharray=""/><text x="55" y="213" font-size="25" fill="currentColor" font-weight="normal" text-anchor="start">Your CSV</text><text x="55" y="247" font-size="15" fill="currentColor" font-weight="normal" text-anchor="start">File, drop or pasted text</text><rect x="360" y="160" width="350" height="90" fill="#fff" stroke="#762b3b" stroke-dasharray=""/><text x="380" y="191" font-size="22" fill="#762b3b" font-weight="bold" text-anchor="start">Module worker</text><text x="380" y="222" font-size="16" fill="currentColor" font-weight="normal" text-anchor="start">Parse records and apply checks</text><rect x="360" y="300" width="350" height="85" fill="#fff" stroke="#762b3b" stroke-dasharray=""/><text x="380" y="331" font-size="22" fill="#762b3b" font-weight="bold" text-anchor="start">Review workspace</text><text x="380" y="361" font-size="16" fill="currentColor" font-weight="normal" text-anchor="start">Rules, search and original values</text><path d="M255 225 H308 V205 H358" fill="none" stroke="#762b3b" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 250 V298" fill="none" stroke="#762b3b" stroke-width="2" marker-end="url(#arrow)"/><path d="M585 300 V252" fill="none" stroke="#762b3b" stroke-width="2" marker-end="url(#arrow)"/><text x="388" y="280" font-size="13" fill="currentColor" font-weight="normal" text-anchor="start">results</text><text x="595" y="280" font-size="13" fill="currentColor" font-weight="normal" text-anchor="start">rules</text><rect x="830" y="160" width="235" height="85" fill="#762b3b" stroke="none" stroke-dasharray=""/><text x="850" y="192" font-size="22" fill="#fff7ed" font-weight="bold" text-anchor="start">Ready rows</text><text x="850" y="221" font-size="16" fill="#fff7ed" font-weight="normal" text-anchor="start">CSV export</text><rect x="830" y="300" width="235" height="85" fill="#fff" stroke="#762b3b" stroke-dasharray=""/><text x="850" y="332" font-size="21" fill="#762b3b" font-weight="bold" text-anchor="start">Excluded records</text><text x="850" y="360" font-size="16" fill="currentColor" font-weight="normal" text-anchor="start">JSON + original values</text><path d="M710 342 H790 V204 H828" fill="none" stroke="#762b3b" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 342 H828" fill="none" stroke="#762b3b" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="452" font-size="16" fill="currentColor" font-weight="normal" text-anchor="start">Processing stays inside the tab. Exports are created only when you request a download.</text></g></svg>
